spring:
  threads:
    virtual:
      enabled: true
  application:
    name: yu-ai-agent
  profiles:
    active: local
  devtools:
    restart:
      additional-paths: classpath:prompts/
      enabled: true
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/agent?useUnicode=true&characterEncoding=utf-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      timeout: 3000
  ai:
    dashscope:
      # 需要替换为你自己的 key
      api-key: sk-c7d19e947ddf45788b9677bdb22af538
      chat:
        options:
          model: qwen-plus
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b
