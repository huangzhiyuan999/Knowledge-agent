spring:
  threads:
    virtual:
      enabled: true
  application:
    name: yu-ai-agent
  profiles:
    active: local
  devtools:
    restart:
      additional-paths: classpath:prompts/
      enabled: true
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/agent?useUnicode=true&characterEncoding=utf-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      timeout: 3000
  ai:
    dashscope:
      api-key: sk-c7d19e947ddf45788b9677bdb22af538
      chat:
        options:
          model: qwen-plus-2025-07-28
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b
    mcp:
      client:
        request-timeout: 120000
        stdio:
          servers-configuration: classpath:mcp-servers.json

# RAG 检索配置
rag:
  chunk:
    size: 512
    overlap: 128
  retrieval:
    keyword-top-k: 5
    semantic-top-k: 5
    rerank-top-k: 3
    bm25-weight: 0.5
    vector-weight: 0.5
  bm25:
    k1: 1.5
    b: 0.75
  embedding:
    model: dashscope
    vector-db: simple
  context-prefix: "参考知识：\n"

jwt:
  secret: tiantian-yuai-agent-jwt-secret-key-2026
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

server:
  port: 8123
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.tiantian.yuaiagent.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

pixabay:
  api-key: YOUR_PIXABAY_API_KEY

search-api:
  api-key: WK1hJtSD76nrqLc4UqW7swb7

logging:
  level:
    org.springframework.ai: DEBUG
